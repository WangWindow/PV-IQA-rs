[package]
name = "pv-iqa-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
candle-core = { version = "0.10.2", features = ["cuda", "cudnn"] }
candle-nn = { version = "0.10.2", features = ["cuda", "cudnn"] }
candle-onnx = "0.10.2"
chrono = "0.4.44"
image = "0.25.10"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "time",
] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
