[package]
name = "pv-iqa-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]

[dependencies]
anyhow = "1.0.102"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-onnx = "0.10.2"
clap = { version = "4", features = ["derive"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
image = "0.25.10"
jpeg-decoder = "0.3.2"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
candle-onnx = { path = "candle-onnx" }
